# This workflow creates a PR to the upstream sonic-net/sonic-buildimage repository
# when a PR in this fork is merged and has the "push-to-upstream" label.
#
# Prerequisites:
# 1. A GitHub Personal Access Token (PAT) with repo scope stored as UPSTREAM_TOKEN secret
# 2. The PAT must have write access to the upstream repository (sonic-net/sonic-buildimage)
#
# Usage:
# 1. Create a PR in this fork
# 2. Add the "push-to-upstream" label to the PR
# 3. Merge the PR
# 4. The workflow will automatically create a PR to the upstream repository

name: Push PR to Upstream

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master

jobs:
  push_to_upstream:
    # Only run if PR was merged and has the "push-to-upstream" label
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'push-to-upstream')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Debug - Print event information
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Merge Commit SHA: ${{ github.event.pull_request.merge_commit_sha }}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          # Add the upstream repository as a remote
          git remote add upstream https://x-access-token:${UPSTREAM_TOKEN}@github.com/sonic-net/sonic-buildimage.git
          git fetch upstream master
          git remote -v

      - name: Create branch and cherry-pick
        id: cherry_pick
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -e
          
          # Create a unique branch name for the upstream PR
          BRANCH_NAME="fork-pr-${PR_NUMBER}-$(date +%s)"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          # Create a new branch from upstream/master
          git checkout -b ${BRANCH_NAME} upstream/master
          
          # Cherry-pick the merge commit
          if git cherry-pick ${MERGE_SHA} --strategy-option=theirs; then
            echo "Cherry-pick successful"
            echo "cherry_pick_success=true" >> $GITHUB_OUTPUT
          else
            echo "Cherry-pick failed, attempting to resolve conflicts"
            # If cherry-pick fails, abort and report
            git cherry-pick --abort || true
            echo "cherry_pick_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Push branch to upstream
        if: steps.cherry_pick.outputs.cherry_pick_success == 'true'
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          BRANCH_NAME: ${{ steps.cherry_pick.outputs.branch_name }}
        run: |
          git push upstream HEAD:${BRANCH_NAME}

      - name: Create PR to upstream
        if: steps.cherry_pick.outputs.cherry_pick_success == 'true'
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          BRANCH_NAME: ${{ steps.cherry_pick.outputs.branch_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Authenticate with GitHub CLI
          echo ${UPSTREAM_TOKEN} | gh auth login --with-token
          
          # Create the PR body with reference to the original PR
          UPSTREAM_PR_BODY="## Original PR
          
          This PR was automatically created from a fork PR.
          
          - **Original PR**: ${PR_URL}
          - **Original Author**: @${PR_AUTHOR}
          - **Fork PR Number**: #${PR_NUMBER}
          
          ## Description
          
          ${PR_BODY}"
          
          # Create the PR
          gh pr create \
            --repo sonic-net/sonic-buildimage \
            --head ${BRANCH_NAME} \
            --base master \
            --title "[Fork PR #${PR_NUMBER}] ${PR_TITLE}" \
            --body "${UPSTREAM_PR_BODY}"

      - name: Comment on original PR
        if: steps.cherry_pick.outputs.cherry_pick_success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment ${PR_NUMBER} --body "A PR has been created to the upstream sonic-net/sonic-buildimage repository."

      - name: Handle cherry-pick failure
        if: steps.cherry_pick.outputs.cherry_pick_success == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment ${PR_NUMBER} --body "Failed to create upstream PR due to cherry-pick conflicts. Please manually create a PR to the upstream repository."
